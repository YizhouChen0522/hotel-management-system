server {
    listen 443 ssl;
    server_name ${PUBLIC_HOST};

    location /api/public/ {
        proxy_pass http://hotel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Provider callback is an explicit non-customer public ingress; application-level signature verification remains authoritative.
    location ^~ /api/payments/webhooks/ {
        proxy_pass http://hotel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/health { proxy_pass http://hotel_backend; }
    location /api/ { return 404; }
}

server:
  port: 8080

spring:
  application:
    name: hotel-backend

  datasource:
    url: REMOVED_DB_URL?useUnicode=true&characterEncoding=utf-8&serverTimezone=America/Toronto
    username: REMOVED_DB_USERNAME
    password: REMOVED_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.johnny.hotel.entity

logging:
  level:
    com.johnny.hotel: debug
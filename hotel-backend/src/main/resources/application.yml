server:
  port: 8080

spring:
  application:
    name: hotel-backend

  datasource:
    url: ${DB_URL}?useUnicode=true&characterEncoding=utf-8&connectionTimeZone=LOCAL
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 3s

  cache:
    type: redis

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Initial existing database

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.johnny.hotel.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.johnny.hotel: debug

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

hotel:
  currency: CNY
  payments:
    checkout-ttl-minutes: ${PAYMENT_CHECKOUT_TTL_MINUTES:15}
    mock:
      webhook-secret: ${MOCK_PAYMENT_WEBHOOK_SECRET:}
  payment:
    recovery:
      enabled: ${PAYMENT_RECOVERY_ENABLED:true}
      fixed-delay: ${PAYMENT_RECOVERY_FIXED_DELAY:30s}
      pending-query-after: ${PAYMENT_RECOVERY_PENDING_QUERY_AFTER:2m}
      batch-size: ${PAYMENT_RECOVERY_BATCH_SIZE:20}
      lease-duration: ${PAYMENT_RECOVERY_LEASE_DURATION:1m}
      initial-backoff: ${PAYMENT_RECOVERY_INITIAL_BACKOFF:30s}
      max-backoff: ${PAYMENT_RECOVERY_MAX_BACKOFF:30m}
  pagination:
    max-page-size: 100
    browse-limit: 100
